version: '3.8'

services:
  # Oracle Database Container
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: oracle-xe-fsd2
    environment:
      - ORACLE_PASSWORD=system
    ports:
      - "1522:1521"
    networks:
      - fsd2-network

  # Tomcat + Web Application Container
  webapp:
    image: tomcat:9.0-jdk21
    container_name: fsd2-webapp
    ports:
      - "8081:8080"
    depends_on:
      - oracle-db
    environment:
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - DB_SERVICE=FREEPDB1
      - DB_USER=system
      - DB_PASSWORD=system
    volumes:
      - ./web:/usr/local/tomcat/webapps/ROOT
      - ./src:/usr/local/tomcat/webapps/WEB-INF/classes
      - ./lib/ojdbc11.jar:/usr/local/tomcat/lib/ojdbc11.jar
    networks:
      - fsd2-network

networks:
  fsd2-network:
    driver: bridge
