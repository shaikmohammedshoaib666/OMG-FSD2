<!DOCTYPE html>
<html>
<head><title>Student Registration</title>
<style>
body{font-family:Arial;margin:0;background:#f0f4f8;display:flex;justify-content:center;padding:30px}
.card{background:#fff;padding:30px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1);width:420px}
h2{color:#1a5276;text-align:center}
input{width:100%;padding:9px;margin:7px 0;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:12px;background:#1a8a4c;color:#fff;border:none;border-radius:5px;font-size:16px;cursor:pointer}
a{color:#1a5276}
</style>
</head>
<body>
<div class="card">
<h2>New Student Registration</h2>
<form method="post" action="../cs/register">
<label>Roll Number *</label><input type="text" name="roll_no" required/>
<label>Student Name *</label><input type="text" name="name" required/>
<label>Branch *</label><input type="text" name="branch" placeholder="CSE / IT / ECE" required/>
<label>Semester *</label><input type="text" name="semester" placeholder="e.g. 5" required/>
<label>Email ID *</label><input type="email" name="email" required/>
<label>Phone Number *</label><input type="text" name="phone" placeholder="10 digits" required/>
<label>Password *</label><input type="password" name="password" required/>
<button type="submit">Register</button>
</form>
<p style="text-align:center"><a href="login.html">Back to Login</a></p>
</div>
</body>
</html>
